<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal boot sequence: loading cloud modules, AI engine, automation, curiosity, status online, welcome Saptarshi">
  <style>
    .bg      { fill:#FAFBFC; }
    .panel   { fill:#FFFFFF; stroke:#D7DCE1; stroke-width:1; }
    .titlebar{ fill:#F1F3F5; }
    .dot-r   { fill:#E5645B; }
    .dot-y   { fill:#D9A441; }
    .dot-g   { fill:#4C9A6A; }
    .path    { fill:#57606A; font-family:'JetBrains Mono','Fira Code',monospace; font-size:13px; }
    .prompt  { fill:#0E7C74; font-family:'JetBrains Mono','Fira Code',monospace; font-size:15px; }
    .line    { fill:#24292F; font-family:'JetBrains Mono','Fira Code',monospace; font-size:15px; }
    .ok      { fill:#1A7A46; font-family:'JetBrains Mono','Fira Code',monospace; font-size:15px; }
    .status  { fill:#0E7C74; font-family:'JetBrains Mono','Fira Code',monospace; font-size:17px; font-weight:600; }
    .welcome { fill:#111417; font-family:'JetBrains Mono','Fira Code',monospace; font-size:19px; font-weight:600; }
    .sub     { fill:#57606A; font-family:'JetBrains Mono','Fira Code',monospace; font-size:13px; }
    .row { opacity:0; animation: reveal 9s ease-in-out infinite; }
    .r1 { animation-delay: 0.2s; }
    .r2 { animation-delay: 1.1s; }
    .r3 { animation-delay: 2.0s; }
    .r4 { animation-delay: 2.9s; }
    .r5 { animation-delay: 3.9s; }
    .r6 { animation-delay: 4.6s; }
    @keyframes reveal {
      0%   { opacity:0; transform:translateX(-6px); }
      4%   { opacity:1; transform:translateX(0); }
      88%  { opacity:1; }
      96%  { opacity:0; }
      100% { opacity:0; }
    }
    .cursor { fill:#0E7C74; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  </style>

  <rect class="bg" width="1000" height="290" rx="10"/>
  <rect class="panel" x="0.5" y="0.5" width="999" height="289" rx="10"/>

  <path class="titlebar" d="M10 0 H990 A10 10 0 0 1 1000 10 V38 H0 V10 A10 10 0 0 1 10 0 Z"/>
  <circle class="dot-r" cx="26" cy="19" r="6"/>
  <circle class="dot-y" cx="46" cy="19" r="6"/>
  <circle class="dot-g" cx="66" cy="19" r="6"/>
  <text class="path" x="500" y="24" text-anchor="middle">saptarshi@kiit &#8212; zsh &#8212; 100&#215;30</text>

  <text class="prompt" x="32" y="76">saptarshi@kiit</text>
  <text class="sub" x="200" y="76">:~$ ./boot --profile</text>

  <g class="row r1"><text class="line" x="32" y="108">[1/4] Loading Cloud Modules&#8230;      <tspan class="ok">OK</tspan></text></g>
  <g class="row r2"><text class="line" x="32" y="136">[2/4] Loading AI Engine&#8230;           <tspan class="ok">OK</tspan></text></g>
  <g class="row r3"><text class="line" x="32" y="164">[3/4] Loading Automation&#8230;          <tspan class="ok">OK</tspan></text></g>
  <g class="row r4"><text class="line" x="32" y="192">[4/4] Checking Curiosity&#8230;          <tspan class="ok">&#8734;</tspan></text></g>

  <g class="row r5">
    <text class="status" x="32" y="228">STATUS: ONLINE</text>
  </g>

  <g class="row r6">
    <text class="welcome" x="32" y="260">Welcome, Saptarshi.</text>
    <rect class="cursor" x="245" y="248" width="9" height="16"/>
  </g>
</svg>
