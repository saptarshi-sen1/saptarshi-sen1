<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal session closed. Have a great day.">
  <style>
    .bg { fill:#FAFBFC; }
    .panel { fill:#FFFFFF; stroke:#D7DCE1; stroke-width:1; }
    .titlebar { fill:#F1F3F5; }
    .prompt { fill:#0E7C74; font-family:'JetBrains Mono','Fira Code',monospace; font-size:15px; }
    .line { fill:#57606A; font-family:'JetBrains Mono','Fira Code',monospace; font-size:14px; }
    .strong { fill:#24292F; font-family:'JetBrains Mono','Fira Code',monospace; font-size:14px; font-weight:600; }
    .dot-r { fill:#E5645B; }
    .dot-y { fill:#D9A441; }
    .dot-g { fill:#4C9A6A; }
    .cursor { fill:#0E7C74; animation: blink 1s steps(1) infinite; }
    0%,49% { opacity:1; }
    50%,100% { opacity:0; }
  </style>

  <rect class="bg" width="1000" height="150" rx="10"/>
  <rect class="panel" x="0.5" y="0.5" width="999" height="149" rx="10"/>
  <path class="titlebar" d="M10 0 H990 A10 10 0 0 1 1000 10 V38 H0 V10 A10 10 0 0 1 10 0 Z"/>
  <circle class="dot-r" cx="26" cy="19" r="6"/>
  <circle class="dot-y" cx="46" cy="19" r="6"/>
  <circle class="dot-g" cx="66" cy="19" r="6"/>
  <text class="line" x="500" y="24" text-anchor="middle">saptarshi@kiit &#8212; zsh</text>

  <text class="prompt" x="32" y="72">saptarshi@kiit:~$ exit</text>
  <text class="line" x="32" y="98">Connection to kiit closed.</text>
  <text class="strong" x="32" y="126">Have a great day. <tspan class="prompt">&#8212;S</tspan></text>
  <rect class="cursor" x="205" y="114" width="8" height="14"/>
</svg>
